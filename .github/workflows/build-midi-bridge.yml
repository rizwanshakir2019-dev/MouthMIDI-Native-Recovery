name: Build MouthMIDI MIDI Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "midi-bridge-windows/**"
      - ".github/workflows/build-midi-bridge.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MidiBridge
        shell: cmd
        run: |
          msbuild midi-bridge-windows\MidiBridge\MidiBridge.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=Win32

      - name: Upload MidiBridge.exe
        uses: actions/upload-artifact@v4
        with:
          name: MouthMIDI-MidiBridge
          path: |
            midi-bridge-windows/MidiBridge/**/MidiBridge.exe
